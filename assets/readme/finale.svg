<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-label="India Helpline finale — one number, every emergency, always verified">
  <defs>
    <radialGradient id="fglow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#C41414" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#C41414" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#C41414" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fbg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1119"/>
      <stop offset="0.5" stop-color="#101B26"/>
      <stop offset="1" stop-color="#080E15"/>
    </linearGradient>
    <linearGradient id="badge3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D21B1B"/>
      <stop offset="1" stop-color="#8E0D0D"/>
    </linearGradient>
    <linearGradient id="fhair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C41414" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F5A94E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#C41414" stop-opacity="0"/>
    </linearGradient>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .ring1, .ring2, .ring3, .orb, .pulse, .wave, .shim2, .dotring { animation: none !important; }
      }
      .ring1 { transform-origin: 800px 380px; animation: spin 44s linear infinite; }
      .ring2 { transform-origin: 800px 380px; animation: spinR 66s linear infinite; }
      .ring3 { transform-origin: 800px 380px; animation: spin 110s linear infinite; }
      @keyframes spin  { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
      @keyframes spinR { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

      .pulse { transform-origin: 800px 380px; animation: pl 4.2s ease-in-out infinite; }
      @keyframes pl { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }

      .dotring { transform-origin: 800px 380px; animation: spin 90s linear infinite; }
      .orb { opacity: 0.18; animation: ob 9s infinite; }
      .o0{animation-delay:0s}.o1{animation-delay:.75s}.o2{animation-delay:1.5s}.o3{animation-delay:2.25s}
      .o4{animation-delay:3s}.o5{animation-delay:3.75s}.o6{animation-delay:4.5s}.o7{animation-delay:5.25s}
      .o8{animation-delay:6s}.o9{animation-delay:6.75s}.o10{animation-delay:7.5s}.o11{animation-delay:8.25s}
      @keyframes ob { 0%, 12%, 100% { opacity: 0.18; } 5% { opacity: 1; } }

      .wave { animation: wv 7.5s ease-in-out infinite; }
      .w2 { animation-delay: 2.5s; }
      .w3 { animation-delay: 5s; }
      @keyframes wv { 0%,100% { opacity: 0.05; transform: scale(1); } 50% { opacity: 0.16; transform: scale(1.06); } }
      .wave { transform-origin: 800px 380px; }

      .shim2 { animation: sh2 6.5s linear infinite; }
      @keyframes sh2 { 0% { transform: translateX(-220px); opacity: 0; } 12% { opacity: 1; } 58% { opacity: 1; } 80% { transform: translateX(1620px); opacity: 0; } 100% { transform: translateX(1620px); opacity: 0; } }
    </style>
  </defs>

  <rect width="1600" height="760" fill="url(#fbg2)"/>
  <ellipse class="wave"    cx="800" cy="380" rx="560" ry="230" fill="#C41414" opacity="0.05"/>
  <ellipse class="wave w2" cx="800" cy="380" rx="430" ry="300" fill="#E8871E" opacity="0.05"/>
  <ellipse class="wave w3" cx="800" cy="380" rx="640" ry="150" fill="#3DD3A5" opacity="0.04"/>

  <!-- rotating rings -->
  <g class="ring1"><circle cx="800" cy="380" r="290" fill="none" stroke="#C41414" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 14"/></g>
  <g class="ring2"><circle cx="800" cy="380" r="345" fill="none" stroke="#F5A94E" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="60 22 8 22"/></g>
  <g class="ring3"><circle cx="800" cy="380" r="400" fill="none" stroke="#3DD3A5" stroke-opacity="0.3" stroke-width="1.4" stroke-dasharray="2 10"/></g>

  <!-- orbiting helpline beacons -->
  <g class="dotring" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800">
    <g class="orb o0"  fill="#FF8A8A"><circle cx="800"  cy="70"  r="5" fill="#FF8A8A"/><text x="800"  y="46"  text-anchor="middle">112</text></g>
    <g class="orb o1"  fill="#8AD7FF"><circle cx="1029" cy="131" r="5" fill="#8AD7FF"/><text x="1058" y="128" text-anchor="middle">139</text></g>
    <g class="orb o2"  fill="#8AFFB6"><circle cx="1191" cy="248" r="5" fill="#8AFFB6"/><text x="1222" y="246" text-anchor="middle">108</text></g>
    <g class="orb o3"  fill="#FFD28A"><circle cx="1236" cy="380" r="5" fill="#FFD28A"/><text x="1268" y="388" text-anchor="middle">1930</text></g>
    <g class="orb o4"  fill="#8AD7FF"><circle cx="1191" cy="512" r="5" fill="#8AD7FF"/><text x="1222" y="528" text-anchor="middle">1098</text></g>
    <g class="orb o5"  fill="#8AFFB6"><circle cx="1029" cy="629" r="5" fill="#8AFFB6"/><text x="1058" y="650" text-anchor="middle">181</text></g>
    <g class="orb o6"  fill="#FF8A8A"><circle cx="800"  cy="690" r="5" fill="#FF8A8A"/><text x="800"  y="724" text-anchor="middle">1554</text></g>
    <g class="orb o7"  fill="#FFD28A"><circle cx="571"  cy="629" r="5" fill="#FFD28A"/><text x="542"  y="650" text-anchor="middle">14416</text></g>
    <g class="orb o8"  fill="#8AD7FF"><circle cx="409"  cy="512" r="5" fill="#8AD7FF"/><text x="378"  y="528" text-anchor="middle">1033</text></g>
    <g class="orb o9"  fill="#8AFFB6"><circle cx="364"  cy="380" r="5" fill="#8AFFB6"/><text x="332"  y="388" text-anchor="middle">1906</text></g>
    <g class="orb o10" fill="#FF8A8A"><circle cx="409"  cy="248" r="5" fill="#FF8A8A"/><text x="378"  y="246" text-anchor="middle">1078</text></g>
    <g class="orb o11" fill="#FFD28A"><circle cx="571"  cy="131" r="5" fill="#FFD28A"/><text x="542"  y="128" text-anchor="middle">14567</text></g>
  </g>

  <!-- central badge -->
  <g class="pulse">
    <rect x="672" y="252" width="256" height="256" rx="58" fill="url(#badge3)"/>
    <rect x="672" y="252" width="256" height="256" rx="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
    <text x="800" y="404" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="126" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">112</text>
    <rect x="718" y="440" width="164" height="8" rx="4" fill="#FFD9D9"/>
    <text x="800" y="482" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFD9D9" text-anchor="middle" letter-spacing="3">POLICE · FIRE · MEDICAL</text>
  </g>

  <!-- headline -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="800" y="112" font-size="44" font-weight="800" fill="#F2F1EC" text-anchor="middle">One number. Every emergency. Always verified.</text>
  </g>

  <!-- CTA -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="22">
    <a href="https://siddhant-pardeshi.github.io/india-helpline/">
      <rect x="502" y="596" width="252" height="50" rx="25" fill="#C41414"/>
      <text x="628" y="629" fill="#FFFFFF" text-anchor="middle">🌐 Open the live site</text>
    </a>
    <a href="https://github.com/siddhant-pardeshi/india-helpline">
      <rect x="778" y="596" width="330" height="50" rx="25" fill="none" stroke="#3DD3A5" stroke-width="1.8"/>
      <text x="943" y="629" fill="#3DD3A5" text-anchor="middle">★ Star the repo — help 2 AM work</text>
    </a>
    <text x="800" y="700" font-size="18" font-weight="500" fill="#6E7A87" text-anchor="middle">193 verified numbers · 31 of 36 States &amp; UTs · English + हिंदी · offline-first · zero tracking · never auto-dials</text>
  </g>

  <rect x="0" y="754" width="1600" height="6" fill="#0A0F16"/>
  <rect class="shim2" x="0" y="754" width="220" height="6" fill="url(#fhair)"/>
</svg>
