<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="India Helpline pipeline: verify, validate, build, serve">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4C5A6B"/>
    </marker>
    <filter id="ash" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#16202C" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="stag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C41414"/>
      <stop offset="0.5" stop-color="#E8871E"/>
      <stop offset="1" stop-color="#0B7A5E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#FBFAF6"/>
  <style>
    @media (prefers-reduced-motion: reduce) { .flow, .stephl, .shimline { animation: none !important; } }
    .flow { animation: fl 2.6s linear infinite; }
    .f1 { animation-delay: 0s; } .f2 { animation-delay: .52s; } .f3 { animation-delay: 1.04s; }
    .f4 { animation-delay: 1.56s; } .f5 { animation-delay: 2.08s; }
    @keyframes fl { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 82% { opacity: 1; } 100% { transform: translateX(40px); opacity: 0; } }
    .stephl { animation: sh 13s infinite; }
    .s1 { animation-delay: 0s; } .s2 { animation-delay: 2.6s; } .s3 { animation-delay: 5.2s; }
    .s4 { animation-delay: 7.8s; } .s5 { animation-delay: 10.4s; }
    @keyframes sh { 0%, 19%, 100% { opacity: 1; } 6% { opacity: .35; } }
    .shimline { animation: sl 5s linear infinite; }
    @keyframes sl { 0% { transform: translateX(-60px); opacity: 0; } 15% { opacity: 1; } 60% { opacity: 1; } 80% { transform: translateX(1140px); opacity: 0; } 100% { transform: translateX(1140px); opacity: 0; } }
  </style>
  <rect x="0" y="0" width="1200" height="6" fill="url(#stag)"/>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="600" y="52" font-size="26" font-weight="800" fill="#16202C" text-anchor="middle">A number gets published only after it survives this pipeline</text>
    <text x="600" y="80" font-size="16" font-weight="500" fill="#4C5A6B" text-anchor="middle">no evidence, no listing — every card on the site carries its own source link and check date</text>

    <!-- STEP 1: verify -->
    <g filter="url(#ash)">
      <rect x="40" y="120" width="210" height="150" rx="16" fill="#FFFFFF"/>
    </g>
    <rect x="40" y="120" width="210" height="6" rx="3" fill="#C41414"/>
    <text class="stephl s1" x="60" y="152" font-size="13" font-weight="800" fill="#C41414" letter-spacing="1">1 · VERIFY</text>
    <text x="60" y="178" font-size="14.5" font-weight="700" fill="#16202C">Open the operator's page</text>
    <text x="60" y="200" font-size="12.5" fill="#4C5A6B">gov.in / official source read</text>
    <text x="60" y="218" font-size="12.5" fill="#4C5A6B">directly — never a snippet</text>
    <text x="60" y="240" font-size="12.5" fill="#4C5A6B">digits · operator · purpose</text>
    <text x="60" y="258" font-size="12.5" fill="#4C5A6B">matched + quoted as evidence</text>

    <path d="M254 195h40" stroke="#4C5A6B" stroke-width="2" marker-end="url(#arr)"/>
    <circle class="flow f1" cx="256" cy="195" r="5" fill="#C41414"/>

    <!-- STEP 2: record -->
    <g filter="url(#ash)">
      <rect x="298" y="120" width="210" height="150" rx="16" fill="#FFFFFF"/>
    </g>
    <rect x="298" y="120" width="210" height="6" rx="3" fill="#E8871E"/>
    <text class="stephl s2" x="318" y="152" font-size="13" font-weight="800" fill="#E8871E" letter-spacing="1">2 · RECORD</text>
    <text x="318" y="178" font-size="14.5" font-weight="700" fill="#16202C">Versioned JSON data</text>
    <text x="318" y="200" font-size="12.5" fill="#4C5A6B">id · dial string · scope · hours</text>
    <text x="318" y="218" font-size="12.5" fill="#4C5A6B">charges · aliases · languages</text>
    <text x="318" y="240" font-size="12.5" fill="#4C5A6B">sourceUrl + checkedDate</text>
    <text x="318" y="258" font-size="12.5" fill="#4C5A6B">unresolved → quarantined</text>

    <path d="M512 195h40" stroke="#4C5A6B" stroke-width="2" marker-end="url(#arr)"/>
    <circle class="flow f2" cx="514" cy="195" r="5" fill="#E8871E"/>

    <!-- STEP 3: validate -->
    <g filter="url(#ash)">
      <rect x="556" y="120" width="210" height="150" rx="16" fill="#FFFFFF"/>
    </g>
    <rect x="556" y="120" width="210" height="6" rx="3" fill="#1D4ED8"/>
    <text class="stephl s3" x="576" y="152" font-size="13" font-weight="800" fill="#1D4ED8" letter-spacing="1">3 · VALIDATE</text>
    <text x="576" y="178" font-size="14.5" font-weight="700" fill="#16202C">validate.mjs gates publish</text>
    <text x="576" y="200" font-size="12.5" fill="#4C5A6B">required fields · duplicates</text>
    <text x="576" y="218" font-size="12.5" fill="#4C5A6B">dial ↔ display digit match</text>
    <text x="576" y="240" font-size="12.5" fill="#4C5A6B">no +91 on short codes</text>
    <text x="576" y="258" font-size="12.5" fill="#4C5A6B">scope codes · stale checks</text>

    <path d="M770 195h40" stroke="#4C5A6B" stroke-width="2" marker-end="url(#arr)"/>
    <circle class="flow f3" cx="772" cy="195" r="5" fill="#1D4ED8"/>

    <!-- STEP 4: build -->
    <g filter="url(#ash)">
      <rect x="814" y="120" width="210" height="150" rx="16" fill="#FFFFFF"/>
    </g>
    <rect x="814" y="120" width="210" height="6" rx="3" fill="#0B7A5E"/>
    <text class="stephl s4" x="834" y="152" font-size="13" font-weight="800" fill="#0B7A5E" letter-spacing="1">4 · BUILD</text>
    <text x="834" y="178" font-size="14.5" font-weight="700" fill="#16202C">Zero-dependency build</text>
    <text x="834" y="200" font-size="12.5" fill="#4C5A6B">static HTML ×2 language trees</text>
    <text x="834" y="218" font-size="12.5" fill="#4C5A6B">112 pages · readable w/o JS</text>
    <text x="834" y="240" font-size="12.5" fill="#4C5A6B">directory.json for search</text>
    <text x="834" y="258" font-size="12.5" fill="#4C5A6B">print + coverage + 404</text>

    <path d="M1028 195h40" stroke="#4C5A6B" stroke-width="2" marker-end="url(#arr)"/>
    <circle class="flow f4" cx="1030" cy="195" r="5" fill="#0B7A5E"/>

    <!-- STEP 5: serve -->
    <g filter="url(#ash)">
      <rect x="1072" y="120" width="94" height="150" rx="16" fill="#16202C"/>
    </g>
    <text class="stephl s5" x="1119" y="152" font-size="13" font-weight="800" fill="#3DD3A5" letter-spacing="1" text-anchor="middle">5 · SERVE</text>
    <text x="1119" y="178" font-size="14" font-weight="700" fill="#F2F1EC" text-anchor="middle">GitHub</text>
    <text x="1119" y="196" font-size="14" font-weight="700" fill="#F2F1EC" text-anchor="middle">Pages</text>
    <text x="1119" y="222" font-size="11.5" fill="#A9B2BD" text-anchor="middle">service worker</text>
    <text x="1119" y="238" font-size="11.5" fill="#A9B2BD" text-anchor="middle">offline cache</text>
    <text x="1119" y="254" font-size="11.5" fill="#A9B2BD" text-anchor="middle">tel: links</text>

    <!-- guarantee strip -->
    <rect x="40" y="310" width="1126" height="70" rx="14" fill="#FFFFFF" stroke="#E4E0D5"/>
    <g clip-path="url(#gcut)"><rect class="shimline" x="40" y="310" width="60" height="70" fill="#3DD3A5" opacity="0.10"/></g>
    <clipPath id="gcut"><rect x="40" y="310" width="1126" height="70" rx="14"/></clipPath>
    <text x="600" y="340" font-size="15" font-weight="800" fill="#16202C" text-anchor="middle">Withdraw or quarantine a record → rebuild → it disappears from the site AND the offline cache on the visitor's next refresh</text>
    <text x="600" y="366" font-size="13.5" fill="#4C5A6B" text-anchor="middle">review cycle · named owner · change history · rollback = redeploy the previous build — see MAINTENANCE.md</text>
  </g>
</svg>
